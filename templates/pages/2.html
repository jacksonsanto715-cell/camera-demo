<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teste Camera GPS</title>
</head>

<body>

<h1>Teste</h1>

<button onclick="testarCamera()">
    TESTAR CÂMERA
</button>

<button onclick="testarGPS()">
    TESTAR LOCALIZAÇÃO
</button>

<p id="resultado">
    Aguardando...
</p>

<video
    id="video"
    autoplay
    playsinline
    width="320">
</video>


<script>

async function testarCamera() {

    const resultado =
        document.getElementById("resultado");

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        document.getElementById("video")
            .srcObject = stream;

        resultado.textContent =
            "CÂMERA FUNCIONANDO";

    } catch (erro) {

        console.error(erro);

        resultado.textContent =
            "ERRO CÂMERA: " +
            erro.name +
            " - " +
            erro.message;
    }
}


function testarGPS() {

    const resultado =
        document.getElementById("resultado");

    if (!navigator.geolocation) {

        resultado.textContent =
            "Este navegador não suporta GPS.";

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            resultado.textContent =
                "GPS FUNCIONANDO: " +

                position.coords.latitude +

                ", " +

                position.coords.longitude;
        },

        function(erro) {

            console.error(erro);

            resultado.textContent =
                "ERRO GPS: " +

                erro.code +

                " - " +

                erro.message;
        },

        {
            enableHighAccuracy: true,

            timeout: 20000,

            maximumAge: 0
        }
    );
}

</script>

</body>

</html>
