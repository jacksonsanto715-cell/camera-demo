<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login — Painel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #111827,
                    #1f2937
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #111827;
        }


        .login-container {

            width: 100%;

            max-width: 400px;

            padding: 20px;
        }


        .login-card {

            background: white;

            border-radius: 14px;

            padding: 35px;

            box-shadow:
                0 20px 50px
                rgba(0, 0, 0, 0.25);
        }


        h1 {

            margin:
                0 0 8px;

            text-align: center;

            font-size: 25px;
        }


        .subtitle {

            margin:
                0 0 30px;

            text-align: center;

            color: #6b7280;

            font-size: 14px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;
        }


        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 20px;

            border:
                1px solid #d1d5db;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color:
                #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }


        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }


        button:hover {

            background: #1d4ed8;
        }


        .error {

            margin-bottom: 20px;

            padding: 11px;

            border-radius: 8px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 14px;

            text-align: center;
        }


        .footer {

            margin-top: 25px;

            text-align: center;

            color: #9ca3af;

            font-size: 12px;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <h1>
            Painel de Monitoramento
        </h1>


        <p class="subtitle">
            Acesso restrito
        </p>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            autocomplete="off">


            <label for="username">
                Usuário
            </label>


            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
                autofocus>


            <label for="password">
                Senha
            </label>


            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>


            <button
                type="submit">

                Entrar

            </button>


        </form>


        <div class="footer">

            Área restrita

        </div>


    </div>


</div>


</body>

</html>
